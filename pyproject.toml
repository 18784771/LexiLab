[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lexilab"
version = "0.1.0"
description = "LexiLab: a local, vocabulary-driven English learning CLI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "LexiLab" }]
dependencies = [
  "typer==0.29.1",
  "rich==15.0.0",
  "prompt-toolkit==3.0.53",
  "pydantic==2.14.3",
  "fsrs==6.3.3",
  "tomli-w==1.2.0",
  "textual==8.2.8",
  "terminaltexteffects==0.15.0",
  "nltk==3.10.4",
  "rapidfuzz==3.14.6",
]

[project.scripts]
lexi = "lexilab.cli.app:main_entry"

[project.optional-dependencies]
ai = ["openai==3.51.0"]
audio = ["pyttsx3==2.99"]
all = ["openai==3.51.0", "pyttsx3==2.99"]
dev = ["pytest==8.4.2", "pytest-cov==7.0.0", "ruff==0.14.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lexilab = ["ai/prompts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
